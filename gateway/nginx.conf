# QuickBite API Gateway (Nginx)
# Điểm vào DUY NHẤT của hệ thống từ Internet (cổng 80).
# Backend và database không publish cổng nào ra ngoài.

# Giới hạn tốc độ: mỗi IP tối đa 10 request/giây vào /api/
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Dùng DNS nội bộ của Docker (127.0.0.11) và phân giải lại tên service mỗi 10s,
# để gateway vẫn hoạt động khi container order-service được tạo lại (đổi IP).
resolver 127.0.0.11 valid=10s ipv6=off;

log_format gateway '$remote_addr - [$time_local] "$request" $status '
                   'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time '
                   'req_id=$request_id';

server {
    listen 80;
    server_name _;

    server_tokens off;                 # ẩn phiên bản Nginx
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log gateway;

    gzip on;
    gzip_types application/json;

    set $order_service http://order-service:8080;

    # Thông tin gateway
    location = / {
        default_type application/json;
        return 200 '{"service":"quickbite-gateway","routes":["/api/orders","/health"]}\n';
    }

    # Health check của toàn hệ thống (backend + database)
    location = /health {
        proxy_pass $order_service/actuator/health;
        proxy_set_header Host $host;
    }

    # Định tuyến API đặt món -> Spring Boot order-service
    location /api/orders {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass $order_service;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        add_header       X-Request-ID      $request_id always;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Chặn mọi đường dẫn khác (vd: /actuator/** của backend không lộ ra ngoài)
    location / {
        default_type application/json;
        return 404 '{"error":"Not Found"}\n';
    }

    # Backend lỗi / chưa sẵn sàng -> trả JSON thay vì trang HTML mặc định
    error_page 502 503 504 = @backend_down;
    location @backend_down {
        default_type application/json;
        return 503 '{"error":"order-service unavailable"}\n';
    }
}
