spring:
  application:
    name: order-service
  # Giá trị mặc định khi chạy local; trong Docker được ghi đè bởi biến môi trường
  # SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
  datasource:
    url: jdbc:postgresql://localhost:5432/quickbite_db
    username: quickbite
    password: quickbite_pass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
